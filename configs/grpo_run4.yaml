# V2 GRPO run4：run3 + Reward v4（买错细分：尽力-0.45/草率-1.00，截断-0.65）+ KL 0.003→0.005。
# 从 run3 的 checkpoint 50 resume（resume_mode=auto 由启动脚本 override）。2026-10-03。
# 训练目标：在 SFT 初始策略附近扩大有效探索，同时保留轻量 reference KL 约束。
# 训练批次：32 个有效任务组 × n=8，共 256 条轨迹；动态采样会继续补采零方差组。
# 运行前提：使用同一个 SFT checkpoint、同一个训练数据分片和同一个开发集。
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 32                      # 32 个有效任务组，n=8 后得到 256 条训练轨迹
  max_prompt_length: 4096
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error
  num_workers: 0

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:GRPO_MODEL_PATH}          # actor 与冻结 reference 均从同一个 SFT 模型开始
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
    use_fused_kernels: true                  # 分块输出头，避免长轨迹完整物化词表 logits
    fused_kernel_options:
      impl_backend: torch
    enable_activation_offload: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 32                  # veRL 会乘以 n=8，对应 256 条轨迹的一次更新
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    use_dynamic_bsz: false                  # 运行契约要求固定微批次，避免长轨迹改变归一化
    ppo_epochs: 1                             # 每批新采样轨迹只更新一次，降低旧数据偏移
    policy_loss:
      loss_mode: vanilla
    loss_agg_mode: token-mean                 # 按全局有效 assistant token 数归一化
    clip_ratio: 0.2
    clip_ratio_low: 0.2                       # 对称裁剪；当前单轮更新先保持稳定基线
    clip_ratio_high: 0.2
    entropy_coeff: 0.0                        # 只记录熵，不额外改变奖励目标
    calculate_entropy: true
    use_kl_loss: true                         # 轻量 reference KL，约束全参模型累计漂移
    kl_loss_coef: 0.005
    kl_loss_type: low_var_kl
    optim:
      lr: 5.0e-7                              # 位于 run1 与 run2 之间
      lr_warmup_steps: 8
      lr_warmup_steps_ratio: 0.0
      lr_scheduler_type: cosine               # 后段逐步减小更新尺度
      min_lr_ratio: 0.4                       # 终点学习率为峰值的 40%
      num_cycles: 0.5                         # 单调半周期
      betas: [0.9, 0.999]
      weight_decay: 0.01
      clip_grad: 1.0
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 8                                      # 每个任务组保留 8 条轨迹
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.30
    max_num_seqs: 32
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 24576
    agent:
      num_workers: 8
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 24576
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false             # 只做组内中心化，不放大小分差任务
  loss_type: ppo_clip
  filter_groups:
    enable: true                             # DAPO 式补采，过滤组内奖励完全相同的任务
    metric: reward
    max_num_gen_batches: 0                   # V1 ReplayBuffer 不读取该字段
    max_inflight_gen_batches: 1              # 限制补采并发，避免环境会话超过容量
  rollout_correction:
    bypass_mode: false
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false
    rollout_rs: null
    rollout_rs_threshold: null
    loss_type: ppo_clip

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_worker_hooks
      env_vars:
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

trainer:
  total_epochs: 10                           # 1000 题循环 10 轮，给动态采样保留补采余量
  total_training_steps: 125
  save_freq: 10
  test_freq: 10
  val_before_train: true
  rollout_data_dir: ${oc.env:GRPO_ROLLOUT_DIR,null}
  logger: [console, swanlab]
  swanlab_mode: cloud
  project_name: shopping-grpo
  experiment_name: v2-run4
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  resume_mode: disable
  n_gpus_per_node: 4
  nnodes: 1
