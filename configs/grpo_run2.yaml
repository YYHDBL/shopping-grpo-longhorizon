# V2 GRPO run2：外援经验配置（2026-09-30）
# 相对 run1 的三处刹车：KL 锚（use_kl_loss 0.01）+ lr 2e-7 cosine 衰减 + batch 16 题
# 其余基建全部继承 run1 v3 实测值：分块输出头、双 offload、activation offload、24k 序列预算
# 注：algorithm.disable_kl 在 0.9.1 源码中无读取点（外援核实），真正生效的是
# use_kl_loss / use_kl_in_reward 两个开关，本配置用 false/false + use_kl_loss=true 表达
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 16                       # 16 题 × n=8 = 128 条轨迹/步（独立任务翻倍，梯度噪声减半）
  max_prompt_length: 4096
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error
  num_workers: 0

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:GRPO_MODEL_PATH}          # sft-merged：actor 与冻结 ref 同源
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
    use_fused_kernels: true                  # 分块输出头（run1 v3 验证：峰值 43.8~58.7G）
    fused_kernel_options:
      impl_backend: torch
    enable_activation_offload: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    use_dynamic_bsz: true
    ppo_epochs: 1
    policy_loss:
      loss_mode: vanilla
    loss_agg_mode: token-mean
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coeff: 0.0                       # 不加负熵：有 KL 锚后避免双重压制探索
    calculate_entropy: true
    use_kl_loss: true                        # KL 锚：限制偏离 SFT 的程度
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    optim:
      lr: 2.0e-7                             # run1 的 1/5：已发生累计漂移，降峰值
      lr_warmup_steps: 8
      lr_warmup_steps_ratio: 0.0
      lr_scheduler_type: cosine              # 衰减到 min_lr_ratio
      min_lr_ratio: 0.1                      # 终点 2e-8
      num_cycles: 0.5                        # 单调半周期
      betas: [0.9, 0.999]
      weight_decay: 0.01
      clip_grad: 1.0
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 8
    temperature: 1.0                         # 与 run1 可比，熵指标同口径
    top_p: 1.0                               # 消除 nucleus 截断的分布畸变
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.30
    max_num_seqs: 32
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    agent:
      num_workers: 8
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:                                       # KL 参考模型：冻结，param_offload 常驻 CPU
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 24576
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false             # Dr. GRPO：无证据支持开启
  disable_kl: false                          # 死字段（源码无读取点），置 false 表达语义
  loss_type: ppo_clip                        # 顶层 loss_type 不能丢（run1 靠它生效）
  filter_groups:
    enable: true                             # DAPO 动态采样：零方差组（实测 47.9%）淘汰换新题
    metric: reward                           # 必填（enable 时缺失直接 ValueError）
    max_num_gen_batches: 0                   # V1 ReplayBuffer 忽略此值（源码有警告），留 0
    max_inflight_gen_batches: 1              # 同时在飞的补采批次上限，峰值并发仍 128 ≤ 160 槽
  rollout_correction:                        # rollout 引擎与训练引擎的概率差修正
    bypass_mode: false
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false
    rollout_rs: null
    rollout_rs_threshold: null
    loss_type: ppo_clip

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_worker_hooks
      env_vars:
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

trainer:
  total_epochs: 5                            # 动态采样下每步实际消耗 ~31 个题目实例
                                             #（16 有效组 ÷ 52% 有效率），125 步 ≈ 3900 个；
                                             # 1000 题 × 5 epoch = 5000 供给，留余量防断粮
  total_training_steps: 125
  save_freq: 10                              # 细粒度打捞点（12 个 × 53G，磁盘已核算）
  test_freq: 10
  val_before_train: true
  rollout_data_dir: ${oc.env:GRPO_ROLLOUT_DIR,null}   # 每步轨迹 reward 落盘，组级指标离线可算
  logger: [console, swanlab]
  swanlab_mode: cloud
  project_name: shopping-grpo
  experiment_name: v2-run2
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  resume_mode: disable
  n_gpus_per_node: 4
  nnodes: 1
