# Long-horizon Feed shopping GRPO configuration (veRL 0.8).
# This file configures training; the static preflight never launches it.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:FEED_GRPO_TRAIN_FILE}
  val_files: ${oc.env:FEED_GRPO_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  max_response_length: 61440
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:FEED_GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 65536
    use_dynamic_bsz: false
    freeze_vision_tower: true
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    max_num_seqs: 4
    max_model_len: 65536
    max_num_batched_tokens: 65536
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 65536
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 8
      default_agent_loop: feed_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/feed_agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      # 48 videos * (3 information calls + 1 commit) = 192 accepted calls.
      # veRL checks the turn cap before parsing the call at the boundary, so 256
      # leaves room for the final commit and a bounded number of guard retries.
      max_user_turns: 256
      max_assistant_turns: 256
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/feed_tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 65536
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

# Reuse the repository's pinned veRL dynamic-sampling patch.  It samples groups
# on the scalar sequence reward; process credit remains audit metadata.
shopping_dynamic_sampling:
  enable: true
  metric: seq_reward
  max_num_gen_batches: 3
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

feed_process_credit:
  mode: ${oc.env:FEED_CREDIT_MODE,terminal}
  metadata_only: true
  native_advantage_integration: false
  native_reward_boundary: scalar_terminal_reward_only

feed_runtime:
  required_verl_version: 0.8.0
  environment_version: feed-environment-v1
  observation_version: feed-observation-v1
  tools_version: feed-tools-v1
  reward_version: feed-reward-v1
  llm_judge: false

# Reward comes directly from the probabilistic simulator; no LLM judge/reward model.
reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_torch_padding_fallback

trainer:
  total_epochs: 50
  total_training_steps: 500
  save_freq: 50
  test_freq: 50
  val_before_train: true
  logger: [console]
  project_name: feed-shopping-grpo
  experiment_name: feed-longhorizon-grpo
  default_local_dir: ${oc.env:FEED_GRPO_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
