[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-grpo"
version = "0.1.0"
description = "ShopSimulator shopping-agent post-training and trajectory evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
eval = []
sft = [
  "torch>=2.5",
  "transformers>=5.5.3,<5.11,!=5.6.0",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
  "torchvision",
  "pillow",
  "swanlab>=0.8,<1",
]
sft-accelerated = [
  "bitsandbytes>=0.45,<1",
  "liger-kernel>=0.6,<1",
]
grpo = [
  "verl==0.9.1",
  "vllm==0.25.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "transformers>=5.5.3,<5.11,!=5.6.0",
  "ray[default]==2.56.1",
  "tensordict==0.10.0",
  "numpy==2.2.6",
  "swanlab==0.9.1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
shopping-grpo = "shopping_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shopping_grpo.resources" = ["*.json"]

[tool.uv]
override-dependencies = [
  "numpy==2.2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["shopping_grpo"]
ignore_missing_imports = true
